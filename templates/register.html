{% extends "layout.html" %}
{% block title %}Register — NeuroTrack{% endblock %}
{% block content %}
<div class="nt-auth-page" style="padding:40px 24px;">
  <div class="nt-auth-card" style="max-width:640px;">
    <p class="nt-eyebrow" style="margin-bottom:12px;">Cognitive Metrics Lab</p>
    <h1>Participant Registration</h1>
    <p class="subtitle">Enter your details once. Your participant ID will be generated automatically.</p>

    <form method="post" action="{{ url_for('register') }}" style="display:grid;gap:18px;">
      <div class="nt-field">
        <label for="name">Full Name</label>
        <input class="nt-input" id="name" name="name" type="text" autocomplete="name" placeholder="Your name" required>
      </div>
      <div class="nt-field">
        <label for="username">Username</label>
        <input class="nt-input" id="username" name="username" type="text" autocomplete="username" placeholder="unique_handle" required>
      </div>
      <div class="nt-form-grid">
        <div class="nt-field">
          <label for="age">Age</label>
          <input class="nt-input" id="age" name="age" type="number" min="1" max="120" placeholder="25" required>
        </div>
        <div class="nt-field">
          <label for="role">Role</label>
          <select class="nt-input" id="role" name="role" required>
            <option value="">Select role</option>
            <option value="patient">Patient</option>
            <option value="psychologist">Psychologist</option>
          </select>
        </div>
        <div class="nt-field">
          <label for="gender">Gender</label>
          <select class="nt-input" id="gender" name="gender" required>
            <option value="">Select gender</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="prefer_not_to_say">Prefer not to say</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
      <div class="nt-field">
        <label for="password">Password</label>
        <input class="nt-input" id="password" name="password" type="password" placeholder="Create a secure password" required>
      </div>
      <label class="nt-consent-box">
        <input name="consent" type="checkbox" value="yes" required>
        <span>I agree to participate and allow my anonymised data to be used for behavioural and cognitive research.</span>
      </label>
      <button class="nt-btn nt-btn-primary nt-btn-full" type="submit">
        <span class="material-symbols-outlined" style="font-size:16px">person_add</span>
        Create Account
      </button>
    </form>
    <p class="nt-auth-switch">
      Already registered? <a href="{{ url_for('login') }}">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
