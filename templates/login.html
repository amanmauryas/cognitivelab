{% extends "layout.html" %}
{% block title %}Login — NeuroTrack{% endblock %}
{% block content %}
<div class="nt-auth-page">
  <div class="nt-auth-card">
    <p class="nt-eyebrow" style="margin-bottom:12px;">Cognitive Metrics Lab</p>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in with your registered username and password.</p>

    <form method="post" action="{{ url_for('login') }}" style="display:grid;gap:18px;">
      <div class="nt-field">
        <label for="username">Username</label>
        <input class="nt-input" id="username" name="username" type="text" autocomplete="username" placeholder="your_username" required>
      </div>
      <div class="nt-field">
        <label for="password">Password</label>
        <input class="nt-input" id="password" name="password" type="password" placeholder="••••••••" required>
      </div>
      <button class="nt-btn nt-btn-primary nt-btn-full" type="submit" style="margin-top:4px;">
        <span class="material-symbols-outlined" style="font-size:16px">login</span>
        Sign In
      </button>
    </form>

    <p class="nt-auth-switch">
      No account? <a href="{{ url_for('register') }}">Register as participant</a>
    </p>
  </div>
</div>
{% endblock %}
